# https://packaging.python.org/en/latest/guides/writing-pyproject-toml/

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-ergo"
description = "AI Knowledgebase Toolkit for Django"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
    "django>=4.2",
    "django-environ",
]

dynamic = ["version", "readme"]
requires-python = ">=3.8"
authors = [
  { name = "leeward bound", email = "leeward@Boundcorp.net" },
]

[project.urls]
# Homepage = "https://github.com/boundcorp/django-ergo"
# Documentation = "https://readthedocs.org//django-ergo"
Repository = "https://github.com/boundcorp/django-ergo.git"
Issues = "https://github.com/boundcorp/django-ergo/issues"
Changelog = "https://github.com/boundcorp/django-ergo/blob/master/HISTORY.md"

# [project.scripts]
# django_ergo = "django_ergo.cli:run"

[project.optional-dependencies]
legacy = ["psycopg[binary]", "pgvector", "openai"]
openai = ["openai"]
filesystem = ["pyyaml>=6.0"]
bots = ["pyyaml>=6.0", "jinja2>=3.1", "markdown-it-py>=3.0"]
browser = ["playwright>=1.55"]  # the browser plugin (connects to Chrome over CDP)
images = ["Pillow"]  # downscale images before they go to the model
telemetry = [
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-grpc",
]
dev = [
    "pgvector",
    "openai",
    "twine",
    "wheel",
    "build",
    "django>=4.2",
    "django-environ",
    "django-extensions",
    "pip-freezer",
    "pytest",
    "pytest-mock",
    "pytest-xdist",
    "playwright>=1.55",  # the browser extra, so CI runs the browser plugin tests
    "Pillow",  # the images extra, so CI runs the image-downscaling tests
    "ruff",
    "coverage",
    "djlint",
    "pre-commit",
    "factory-boy",
    "django-coverage-plugin",
    "pytest-django",
    "pytest-asyncio",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "markdown-it-py>=3.0",
    "psycopg[binary]",
    "pgserver",
    "python-dotenv",
    # API Example Dependencies
    "django-ninja>=1.1.0",
    "pydantic>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "django-cors-headers>=4.3.0",
]

[tool.setuptools.packages.find]
# https://setuptools.pypa.io/en/latest/userguide/datafiles.html
where = ["src"]

[tool.setuptools.package-data]
# Without git metadata (the Ergonaut image build copies src/ alone) only
# package-data is read, not MANIFEST.in, so list every non-Python file here.
django_ergo = [
    "bots/skill_library/**/*.md",
    "bots/skill_library/**/*.py",
    "templates/**/*.html",
]

[tool.setuptools.dynamic]
version = { attr = "django_ergo.__version__" }
readme = { file = ["README.md", "HISTORY.md"], content-type = "text/markdown" }


# ==== pytest ====
[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--ds=tests.example_app.settings --reuse-db"
python_files = ["tests.py", "test_*.py"]
norecursedirs = ["node_modules", "ergonaut", "ergo", "examples"]
filterwarnings = "ignore::DeprecationWarning"
pythonpath = "src"
asyncio_mode = "auto"

# ==== Coverage ====
[tool.coverage.run]
include = ["*/django_ergo/**/*.py"]
omit = ["*/migrations/*", "*/tests/*"]
plugins = ["django_coverage_plugin"]

[tool.coverage.report]
exclude_also = [
  "def __repr__",
  # "def __str__",
]

# ==== mypy ====
[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]

[[tool.mypy.overrides]]
# Django migrations should not produce any errors:
module = "*.migrations.*"
ignore_errors = true

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".git-rewrite",
  ".hg",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pytype",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "venv",
  "*/migrations/*.py",
  "staticfiles/*",
  "old-code-inspiration/*",
]
# Same as Django: https://github.com/cookiecutter/cookiecutter-django/issues/4792.
line-length = 88
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
select = [
  "F",
  "E",
  "W",
  "C90",
  "I",
  "N",
  "UP",
  "YTT",
  # "ANN", # flake8-annotations: we should support this in the future but 100+ errors atm
  "ASYNC",
  "S",
  "BLE",
  "FBT",
  "B",
  "A",
  "COM",
  "C4",
  "DTZ",
  "T10",
  "DJ",
  "EM",
  "EXE",
  "FA",
  'ISC',
  "ICN",
  "G",
  'INP',
  'PIE',
  "T20",
  'PYI',
  'PT',
  "Q",
  "RSE",
  "RET",
  "SLF",
  "SLOT",
  "SIM",
  "TID",
  "TCH",
  "INT",
  # "ARG", # Unused function argument
  "PTH",
  "ERA",
  "PD",
  "PGH",
  "PL",
  "TRY",
  "FLY",
  # "NPY",
  # "AIR",
  "PERF",
  # "FURB",
  # "LOG",
  "RUF",
]
ignore = [
  "S101",   # Use of assert detected https://docs.astral.sh/ruff/rules/assert/
  "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
  "SIM102", # sometimes it's better to nest
  "ERA001",
  "PGH004",
  "E501",
]
# Project specifc ignore
extend-ignore = [
  "S106",   # hardcoded password in tests
  "RUF005", # iterable unpacking instead of concatenation
  "S104",   # Possible binding to all interfaces,
  "S311",   # We're not using it for cryptography
  "FBT001", # Boolean typed positional argument
  "FBT002", # Boolean default positional argument
  "S308",   # mark_safe is ok here
  # "SLF001"  # accessing private _meta is ok here
  "TRY300", # Consider moving this statement to an `else` block
  "COM812", # Recommended from ruff
  "ISC001", # Recommended from ruff
  "PLC0415", # imports inside functions are deliberate here: optional deps and Django app loading
]
# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
# Older modules kept as they are; new code follows the full rule set.
"src/django_ergo/sync.py" = ["TRY003", "EM101", "EM102", "C901", "PLR0912", "PLR0915", "PLR2004", "UP031", "S603", "S607"]
"src/django_ergo/git_snapshot.py" = ["TRY003", "EM101", "EM102", "C901", "PLR0911", "PLR0912", "PLR2004", "S603", "S607"]
"src/django_ergo/repository_search.py" = ["TRY003", "EM101", "EM102", "C901", "PLR0913", "PLR2004", "UP031"]
"src/django_ergo/paths.py" = ["TRY003", "EM101", "EM102", "TRY004"]
"src/django_ergo/models.py" = ["TRY003", "EM101", "EM102", "DJ001", "UP031"]
"src/django_ergo/conversation/images.py" = ["BLE001"]  # Missing or invalid images are non-fatal.
"src/django_ergo/indexing.py" = ["TRY003", "EM101", "EM102", "C901", "PERF401"]
"src/django_ergo/repository_index.py" = ["TRY003", "EM101", "EM102", "C901", "PLR0913"]
"src/django_ergo/bots/tables.py" = ["SLF001"]  # Django model _meta
"tests/*.py" = ["PT018", "FBT003", "PLR2004", "SLF001", "S603", "S607"]
# Standalone scripts for agents (the ergo client, the skill installer) and the client's bot tools.
"src/django_ergo/bots/skill_library/**/*.py" = ["T201", "S310", "PLR2004", "C901", "PLR0912", "PLR0915", "EM101", "EM102", "TRY003", "PLW0603", "INP001", "FBT001", "FBT002"]
"src/django_ergo/knowledge/schema.py" = ["PLC0415", "PLR0915"]
"src/django_ergo/knowledge/database.py" = ["PLC0415"]
"src/django_ergo/knowledge/articles.py" = ["PLC0415", "SLF001"]
"src/django_ergo/knowledge/usage.py" = ["PLC0415"]
"src/django_ergo/knowledge/usage_files.py" = ["PLC0415"]
"src/django_ergo/knowledge/service.py" = ["PLR0913"]
"src/django_ergo/knowledge/git.py" = ["PLC0415", "S603", "S607"]
"tests/**/*.py" = [
  "PT009",  # Use a regular assert instead of unittest-style assert (TestCase uses assertEqual etc.)
  "S",      # Security checks not needed in test files
  "SLF001", # Accessing private members is acceptable in tests
  "T201",   # Print statements are acceptable in tests (e.g. fixture generation output)
  "PLR2004", # Magic values are acceptable in tests (e.g. embedding dimensions)
]
"src/django_ergo/approval_demo.py" = [
  "T201",    # Print statements expected in demo script
]
"examples/**/*.py" = [
  "INP001",  # Examples are not a package
  "T201",    # Print statements expected in examples
  "S324",    # MD5 used for non-security chunk IDs
  "RUF013",  # Implicit Optional acceptable in examples
  "PLR0913", # Many arguments acceptable in examples
  "PLR2004", # Magic values acceptable in examples
  "RET504",  # Unnecessary assignment acceptable in examples
  "B007",    # Unused loop variable acceptable in examples
  "DTZ005",  # Naive datetime acceptable in examples
  "PERF401", # List comprehension style acceptable in examples
  "F841",    # Unused variable acceptable in examples
  "TRY003",  # Long exception messages acceptable in examples
  "EM102",   # f-string exception messages acceptable in examples
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
force-single-line = true

[tool.djlint]
ignore = "H021"
