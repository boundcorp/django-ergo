; Preparation only. No install/start is performed by this change.
; Inherit only the already-authorized cleaner environment, including its
; existing scoped callback. This config neither reads nor relocates a secret.
[supervisord]
nodaemon=true
logfile=%(ENV_CLEANER_LOG_DIR)s/supervisord.log
pidfile=%(ENV_CLEANER_LOG_DIR)s/supervisord.pid
childlogdir=%(ENV_CLEANER_LOG_DIR)s

[program:ergo-runpod-cleaner]
directory=%(ENV_REPO_ROOT)s
command=%(ENV_PYTHON)s -m django_ergo.plugins.runpod.supervisor %(ENV_LEDGER)s --interval-seconds 1 --operation-timeout 5 --freshness-seconds 10 --execute --credential-env %(ENV_SCOPED_CALLBACK_ENV)s
environment=PYTHONPATH="%(ENV_REPO_ROOT)s/src"
autostart=true
autorestart=true
startsecs=1
startretries=3
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=%(ENV_CLEANER_LOG_DIR)s/cleaner.out.log
stderr_logfile=%(ENV_CLEANER_LOG_DIR)s/cleaner.err.log
