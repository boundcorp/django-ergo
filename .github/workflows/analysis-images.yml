name: Analysis images

# Builds the isolated-analysis runner and controller images from
# infra/analysis/*.Dockerfile with the digest-pinned base in
# infra/analysis/base-images.env and the hash-locked requirements, smoke-tests
# the runner under runc and gVisor (container-log isolation, blocker B7), and
# on main pushes both to GHCR next to the Ergonaut image, printing the digests
# for infra-octo (ergo-analysis admission runnerImage, controller image and
# ANALYSIS_IMAGE). Pull requests build and test without pushing.
#
# GitHub-hosted runners only: the gVisor smoke test installs runsc into the
# runner's Docker, which must never happen on the self-hosted runners.
on:
  push:
    branches: [main]
    paths:
      - "infra/analysis/**"
      - "src/django_ergo/analysis/**"
      - "pyproject.toml"
      - "tests/test_analysis_*.py"
      - ".github/workflows/analysis-images.yml"
  pull_request:
    branches: [main]
    paths:
      - "infra/analysis/**"
      - "src/django_ergo/analysis/**"
      - "pyproject.toml"
      - "tests/test_analysis_*.py"
      - ".github/workflows/analysis-images.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Executor log isolation (real subprocesses, PID-1 variants in a PID
  # namespace), controller integrity check and image inputs. No database.
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Ubuntu 24.04 blocks unprivileged user namespaces through AppArmor; the
      # PID-1 tests need one. Ephemeral GitHub-hosted runner only.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install
        run: |
          python -m pip install uv
          uv pip install --system --require-hashes \
            -r infra/analysis/runner.requirements.txt \
            -r infra/analysis/controller.requirements.txt
          uv pip install --system --no-deps -e .
          uv pip install --system httpx pytest
      # --noconftest: the suite conftest needs Django settings; these do not.
      - name: Run analysis tests
        run: >-
          python -m pytest -q -o addopts='' --noconftest -p no:cacheprovider
          tests/test_analysis_log_isolation.py tests/test_analysis_images.py
          tests/test_analysis_runtime.py

  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      RUNNER: ghcr.io/boundcorp/ergo-analysis-runner
      CONTROLLER: ghcr.io/boundcorp/ergo-analysis-controller
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned base images
        run: |
          set -euo pipefail
          grep -E '^[A-Z][A-Z0-9_]*=' infra/analysis/base-images.env >> "$GITHUB_ENV"
          . infra/analysis/base-images.env
          for ref in "$PYTHON_BASE" "$NGINX_UNPRIVILEGED"; do
            [[ "$ref" =~ @sha256:[0-9a-f]{64}$ ]] || { echo "unpinned: $ref"; exit 1; }
          done
      # The nginx sidecar is not built here; fail if its pinned digest vanished.
      - name: Resolve the pinned nginx-unprivileged digest
        run: docker buildx imagetools inspect "$NGINX_UNPRIVILEGED" > /dev/null
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the runner image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/analysis/runner.Dockerfile
          build-args: PYTHON_BASE=${{ env.PYTHON_BASE }}
          load: true
          tags: ${{ env.RUNNER }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=analysis-runner
          cache-to: ${{ env.PUBLISH == 'true' && 'type=gha,mode=max,scope=analysis-runner' || '' }}
      - name: Build the controller image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/analysis/controller.Dockerfile
          build-args: PYTHON_BASE=${{ env.PYTHON_BASE }}
          load: true
          tags: ${{ env.CONTROLLER }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=analysis-controller
          cache-to: ${{ env.PUBLISH == 'true' && 'type=gha,mode=max,scope=analysis-controller' || '' }}
      - name: Controller image imports its entrypoint
        run: >-
          docker run --rm --network none --read-only --cap-drop ALL
          --entrypoint python "$CONTROLLER:sha-${{ github.sha }}" -I -c
          "import kubernetes, django_ergo.analysis.controller, django_ergo.analysis.kubernetes"
      - name: Runner smoke test under runc
        run: python3 infra/analysis/smoke_test.py "$RUNNER:sha-${{ github.sha }}" --runtime runc
      # Same gVisor release as Octo's sandbox handler, checked against its SHA512.
      - name: Install gVisor runsc
        run: |
          set -euo pipefail
          curl -fsSLo "$RUNNER_TEMP/gvisor.tar.bz2" \
            "https://storage.googleapis.com/gvisor/releases/release/$GVISOR_RELEASE/x86_64/gvisor.tar.bz2"
          echo "$GVISOR_SHA512  $RUNNER_TEMP/gvisor.tar.bz2" | sha512sum -c -
          sudo mkdir -p /opt/gvisor
          sudo tar -xjf "$RUNNER_TEMP/gvisor.tar.bz2" -C /opt/gvisor
          sudo /opt/gvisor/runsc install --runtime runsc -- --network=none
          sudo systemctl restart docker
          docker info --format '{{json .Runtimes}}' | grep -q runsc
      - name: Runner smoke test under gVisor
        run: python3 infra/analysis/smoke_test.py "$RUNNER:sha-${{ github.sha }}" --runtime runsc
      # sha-<commit> tags, then the digests infra-octo must pin. There is no
      # moving tag: the cluster only ever runs a reviewed digest.
      - name: Publish
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          for image in "$RUNNER" "$CONTROLLER"; do
            docker push "$image:sha-${{ github.sha }}"
          done
      - name: Job summary
        if: always()
        run: |
          set -euo pipefail
          digest() {
            if [ "$PUBLISH" = true ]; then
              docker buildx imagetools inspect "$1:sha-${{ github.sha }}" --format '{{json .Manifest.Digest}}' | tr -d '"'
            fi
          }
          runner=$(digest "$RUNNER" || true)
          controller=$(digest "$CONTROLLER" || true)
          {
            echo "### Analysis images (${{ github.sha }})"
            echo
            if [ "$PUBLISH" = true ]; then
              echo "| Image | Pinned reference |"
              echo "| --- | --- |"
              echo "| runner (admission \`runnerImage\`, controller \`ANALYSIS_IMAGE\`) | \`$RUNNER@$runner\` |"
              echo "| controller | \`$CONTROLLER@$controller\` |"
            else
              echo "Built and smoke-tested (runc and gVisor $GVISOR_RELEASE); not pushed (${{ github.event_name }})."
            fi
            echo
            echo "| Base | Pinned reference |"
            echo "| --- | --- |"
            echo "| python | \`$PYTHON_BASE\` |"
            echo "| nginx-unprivileged (controller TLS sidecar) | \`$NGINX_UNPRIVILEGED\` |"
            echo
            echo "No dependency vulnerability scan: the repository has no scanner configured yet."
          } >> "$GITHUB_STEP_SUMMARY"
