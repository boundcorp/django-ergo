name: Ergonaut

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

# A newer push to the same branch or PR cancels the older run, so the
# runners work on the latest commit instead of a backlog.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # runs-on: pushes and PRs from branches of this repo run on our self-hosted
  # runners; PRs from forks run on GitHub-hosted runners. Setting the
  # repository variable CI_GITHUB_HOSTED=true sends every job to GitHub-hosted.
  test:
    runs-on: ${{ (vars.CI_GITHUB_HOSTED != 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","boundcorp"]') || 'ubuntu-24.04' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ergonaut
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'ergonaut/pyproject.toml', 'ergonaut/requirements.freeze.txt') }}
          restore-keys: uv-${{ runner.os }}-
      - name: Install Ergonaut with Ergo from this checkout
        run: |
          python -m pip install --upgrade pip uv
          uv venv -p 3.12 .venv
          uv pip install -e "..[legacy,bots]" -e .
      - name: Run tests on embedded PostgreSQL
        run: env -u DATABASE_URL .venv/bin/python -m pytest -q --durations=25
      - name: Check migrations
        run: env -u DATABASE_URL .venv/bin/python manage.py makemigrations --check --dry-run

  # Pushes only: PRs run the tests, and the image is built when main publishes
  # (the publish job needs this smoke test).
  image:
    if: github.event_name == 'push'
    runs-on: ${{ (vars.CI_GITHUB_HOSTED != 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","boundcorp"]') || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Layers are cached in the GitHub Actions cache (scope "ergonaut"), shared
      # with the publish job, so a fresh runner reuses earlier builds.
      - uses: docker/setup-buildx-action@v3
      - name: Build the release image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ergonaut/Dockerfile
          target: release
          # Not loaded into Docker: the smoke test runs the aio image, which
          # reuses these layers from the same builder. Loading both doubled the
          # export time on the self-hosted runners.
          cache-from: type=gha,scope=ergonaut
          cache-to: type=gha,scope=ergonaut,mode=max
      - name: Build the all-in-one image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ergonaut/Dockerfile
          target: aio
          load: true
          tags: ergonaut:aio
          cache-from: type=gha,scope=ergonaut
      - name: Start the all-in-one image with the hello bot
        run: |
          docker run -d --name aio -p 8000:8000 -v "$PWD/examples/hello:/bot:ro" ergonaut:aio
          for i in $(seq 1 90); do
            curl -sf localhost:8000/api/healthz && break
            sleep 2
          done
          curl -sf localhost:8000/api/healthz
          for i in $(seq 1 30); do
            docker logs aio 2>&1 | grep -q "celery@.* ready" && docker logs aio 2>&1 | grep -q "Serving bots: hello" && break
            sleep 2
          done
          docker logs aio 2>&1 | grep "Serving bots: hello"
          docker logs aio 2>&1 | grep "embedded Garage"
          docker logs aio 2>&1 | grep "celery@.* ready"
          docker exec aio ergonaut check
          # Non-Python package files ship in the image (package-data in pyproject.toml).
          docker exec aio python -c "import django_ergo, pathlib; p = pathlib.Path(django_ergo.__file__).parent; missing = [f for f in ['bots/skill_library/skillbuilder/SKILL.md', 'templates/admin/django_ergo/chat_history.html'] if not (p / f).exists()]; assert not missing, missing"
      - name: Container logs
        if: always()
        run: |
          docker logs aio 2>&1 | tail -200 || true
          docker rm -f aio || true

  # Publishes the release image. Runs only for pushes to main (never PRs), after
  # tests and the image smoke job pass; the concurrency group serialises
  # publishes so a push never races an older one.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, image]
    runs-on: ${{ (vars.CI_GITHUB_HOSTED != 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","boundcorp"]') || 'ubuntu-24.04' }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    concurrency:
      group: ergonaut-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the release image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ergonaut/Dockerfile
          target: release
          build-args: ERGONAUT_VERSION=${{ github.sha }}
          push: true
          tags: |
            ghcr.io/boundcorp/ergonaut:main
            ghcr.io/boundcorp/ergonaut:sha-${{ github.sha }}
          cache-from: type=gha,scope=ergonaut
