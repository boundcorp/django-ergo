name: Ergonaut

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  # Nightly full run on main catches PRs that passed alone but break together.
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Pull requests: a newer push cancels the older run. Branch pushes (main):
# a running build is never cancelled; GitHub keeps at most one run waiting
# and replaces it with the newest push, so a burst of merges builds the
# running commit and then only the latest one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Tests run on GitHub-hosted runners (free for this public repo, and several
  # times faster than the self-hosted ones), on pull requests, nightly and by
  # hand. A merge to main doesn't rerun them: the PR already passed, and the
  # image job below is what main needs.
  test:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ergonaut
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'ergonaut/pyproject.toml', 'ergonaut/requirements.freeze.txt') }}
          restore-keys: uv-${{ runner.os }}-
      - name: Install Ergonaut with Ergo from this checkout
        run: |
          python -m pip install --upgrade pip uv
          uv venv -p 3.12 .venv
          uv pip install -e "..[legacy,bots]" -e .
      - name: Run tests on embedded PostgreSQL
        run: env -u DATABASE_URL .venv/bin/python -m pytest -q --durations=25
      - name: Check migrations
        run: env -u DATABASE_URL .venv/bin/python manage.py makemigrations --check --dry-run

  # Pushes only. Builds the release image once, smoke-tests the aio image
  # built on top of it, and on main pushes the release image as sha-<commit>
  # and then moves the `main` tag to it. The `main` tag only ever points at a
  # commit whose smoke test passed; octo's auto-upgrader follows it.
  # runs-on: pushes run on our self-hosted runners. Setting the repository
  # variable CI_GITHUB_HOSTED=true sends the image job to GitHub-hosted.
  image:
    if: github.event_name == 'push'
    runs-on: ${{ (vars.CI_GITHUB_HOSTED != 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","boundcorp"]') || 'ubuntu-24.04' }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.ref == 'refs/heads/main' }}
      IMAGE: ghcr.io/boundcorp/ergonaut
    steps:
      - uses: actions/checkout@v4
      # Layers are cached in the GitHub Actions cache (scope "ergonaut"), so a
      # fresh runner reuses earlier builds.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the release image (and push it as sha-<commit> on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ergonaut/Dockerfile
          target: release
          build-args: ERGONAUT_VERSION=${{ github.sha }}
          # Not loaded into Docker: the smoke test runs the aio image, which
          # reuses these layers from the same builder.
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=ergonaut
          cache-to: type=gha,scope=ergonaut,mode=max
      - name: Build the all-in-one image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ergonaut/Dockerfile
          target: aio
          build-args: ERGONAUT_VERSION=${{ github.sha }}
          load: true
          tags: ergonaut:aio
          cache-from: type=gha,scope=ergonaut
      - name: Start the all-in-one image with the hello bot
        run: |
          docker run -d --name aio -p 8000:8000 -v "$PWD/examples/hello:/bot:ro" ergonaut:aio
          for i in $(seq 1 90); do
            curl -sf localhost:8000/api/healthz && break
            sleep 2
          done
          curl -sf localhost:8000/api/healthz
          for i in $(seq 1 30); do
            docker logs aio 2>&1 | grep -q "celery@.* ready" && docker logs aio 2>&1 | grep -q "Serving bots: hello" && break
            sleep 2
          done
          docker logs aio 2>&1 | grep "Serving bots: hello"
          docker logs aio 2>&1 | grep "embedded Garage"
          docker logs aio 2>&1 | grep "celery@.* ready"
          docker exec aio ergonaut check
          # Non-Python package files ship in the image (package-data in pyproject.toml).
          docker exec aio python -c "import django_ergo, pathlib; p = pathlib.Path(django_ergo.__file__).parent; missing = [f for f in ['bots/skill_library/skillbuilder/SKILL.md', 'templates/admin/django_ergo/chat_history.html'] if not (p / f).exists()]; assert not missing, missing"
      - name: Container logs
        if: always()
        run: |
          docker logs aio 2>&1 | tail -200 || true
          docker rm -f aio || true
      - name: Publish (move the main tag to this commit)
        if: env.PUBLISH == 'true'
        run: docker buildx imagetools create -t "$IMAGE:main" "$IMAGE:sha-${{ github.sha }}"
