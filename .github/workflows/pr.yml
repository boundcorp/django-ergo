name: PR checks

# Fast checks only, so a pull request is green in about a minute. The full
# test suites, the migration drift checks, the native-voice tests and the
# release image run on main (test.yml, ergonaut.yml), nightly, and by hand
# from the Actions tab (Run workflow) on any branch.
on:
  pull_request:
    branches: [main, master, develop]
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Same ruff version as .pre-commit-config.yaml and the dev extra.
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
      - run: uvx ruff@0.12.5 check .
      - run: uvx ruff@0.12.5 format --check .

  # tsc only (about 30s with the npm cache); the frontend unit tests run on main.
  # Skipped unless the PR touches the frontend.
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Did the frontend change?
        id: changed
        run: |
          if git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- ergonaut/frontend; then
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.changed.outputs.frontend == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ergonaut/frontend/package-lock.json
      - if: steps.changed.outputs.frontend == 'true'
        working-directory: packages/ergo-chat-ui
        run: npm ci && npm run build
      - if: steps.changed.outputs.frontend == 'true'
        working-directory: ergonaut/frontend
        run: npm ci && npx tsc -b

  # The reusable chat UI package: typecheck, tests on React 19 and 18, build, and a fixture run that installs the
  # packed tarball into a Vite app and a Next 16 + MUI 6 Pages Router app (build, plus browser coexistence checks). Skipped unless the PR touches the package.
  chat-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/ergo-chat-ui
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Did the package change?
        id: changed
        working-directory: .
        run: |
          if git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- packages/ergo-chat-ui; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.changed.outputs.changed == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/ergo-chat-ui/package-lock.json
      - if: steps.changed.outputs.changed == 'true'
        run: npm ci && npm run test:all && npm run build && npm run size
      - if: steps.changed.outputs.changed == 'true'
        run: npx --yes playwright@1.56.1 install --with-deps chromium
      - if: steps.changed.outputs.changed == 'true'
        run: npm run fixtures
