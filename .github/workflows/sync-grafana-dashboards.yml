# Ergonaut's dashboards (ergonaut/docs/dashboards/*.json) into Octo Grafana, the
# cookiecutter-django-boundcorp way (docs/adding-telemetry.md): upsert through
# Grafana's API on every push to main that touches them. Needs the repo secrets
# GRAFANA_URL, GRAFANA_SA_TOKEN and GRAFANA_PROMETHEUS_DATASOURCE_UID; until
# they're set the job skips with a warning instead of failing main.
name: Sync Grafana Dashboards

on:
  push:
    branches: [main]
    paths:
      - "ergonaut/docs/dashboards/*.json"
      - "ergonaut/scripts/sync_grafana_dashboards.py"
      - ".github/workflows/sync-grafana-dashboards.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ergonaut
    env:
      GRAFANA_URL: ${{ secrets.GRAFANA_URL }}
      GRAFANA_SA_TOKEN: ${{ secrets.GRAFANA_SA_TOKEN }}
      GRAFANA_PROMETHEUS_DATASOURCE_UID: ${{ secrets.GRAFANA_PROMETHEUS_DATASOURCE_UID }}
      GRAFANA_FOLDER_UID: ${{ secrets.GRAFANA_FOLDER_UID }}
      GRAFANA_FOLDER_TITLE: ${{ vars.GRAFANA_FOLDER_TITLE || 'Ergonaut' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check dashboards parse
        run: python -c "import json, pathlib; [json.loads(p.read_text()) for p in pathlib.Path('docs/dashboards').glob('*.json')]"

      - name: Check Grafana secrets
        id: secrets
        run: |
          if [ -z "$GRAFANA_URL" ] || [ -z "$GRAFANA_SA_TOKEN" ] || [ -z "$GRAFANA_PROMETHEUS_DATASOURCE_UID" ]; then
            echo "::warning::Grafana secrets are not set on this repo; skipping the dashboard sync."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install sync dependencies
        if: steps.secrets.outputs.ready == 'true'
        run: python -m pip install requests

      - name: Sync dashboards
        if: steps.secrets.outputs.ready == 'true'
        run: python scripts/sync_grafana_dashboards.py
