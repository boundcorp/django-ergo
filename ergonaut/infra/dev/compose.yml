services:
  ############################################################
  # Django Services
  ############################################################
  .common-django-settings: &common-django-settings
    extends:
      service: ergonaut-django-dev
      file: ../common/compose.yml
    volumes:
      - ../../:/app
      - ../../../:/ergo
    depends_on:
      - psql
      - redis
    env_file:
      - ../common/.env
      - ../dev/.env
    entrypoint: ["/app/infra/dev/entrypoint.sh"]

  django_shell:
    <<: *common-django-settings
    environment:
      - SERVICE=django_shell
    command: "bash"

  backend:
    <<: *common-django-settings
    ports:
      - "8822:8000"
    command: ["/app/infra/dev/start-runserver.sh"]
    environment:
      - SERVICE=backend

  celery:
    <<: *common-django-settings
    command: ["celery", "-A", "ergonaut", "worker", "-l", "info"]
    environment:
      - SERVICE=celery

  beat:
    <<: *common-django-settings
    command: ["celery", "-A", "ergonaut", "beat", "-l", "info", "--schedule=/tmp/ergonaut-celerybeat-schedule"]
    environment:
      - SERVICE=beat

  ############################################################
  # Frontend
  ############################################################
  frontend:
    image: node:22-slim
    working_dir: /app/frontend
    volumes:
      - ../../frontend:/app/frontend
    command: ["npx", "vite", "--host", "0.0.0.0", "--port", "3000"]
    ports:
      - "2288:3000"

  ############################################################
  # 3rd Party Services
  ############################################################
  psql:
    image: pgvector/pgvector:pg16
    expose: ["5432"]
    environment:
      POSTGRES_DB: ergonaut
      POSTGRES_USER: ergonaut
      POSTGRES_PASSWORD: ergonaut
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    expose: ["6379"]

  garage:
    image: dxflrs/garage:v1.1.0
    expose: ["3900"]
    ports:
      - "3900:3900"
      - "3902:3902"
    environment:
      GARAGE_ALLOW_WORLD_READABLE_SECRETS: "true"
    volumes:
      - garage-data:/var/lib/garage/data
      - garage-meta:/var/lib/garage/meta
      - ./garage.toml:/etc/garage.toml

  ############################################################
  # Ingress
  ############################################################
  ingress:
    image: caddy:2-alpine
    ports:
      - "2228:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
  garage-data:
  garage-meta:
